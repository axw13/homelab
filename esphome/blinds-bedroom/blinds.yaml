substitutions:
  device_name: blindsbed        # hostname / ESPHome node name — change per room
  friendly_name: BlindsBed      # prefix shown in Home Assistant

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  on_boot:
    priority: -200
    then:
      - delay: 8s
      - stepper.report_position:
          id: my_stepper
          position: !lambda 'return id(saved_pos);'
      - delay: 200ms
      - lambda: |-
          id(boot_ready) = true;
          ESP_LOGW("restore",
            "RESTORED: pos=%d open=%d closed=%d open_set=%d closed_set=%d stepper=%d",
            id(saved_pos), id(open_steps), id(closed_steps),
            (int)id(open_set), (int)id(closed_set),
            (int)id(my_stepper).current_position);

esp8266:
  board: nodemcuv2
  restore_from_flash: true

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: none         # Prevents WiFi radio light sleep — fixes periodic drops
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret ap_password

captive_portal:

preferences:
  # Position and calibration are flushed explicitly whenever the motor stops or
  # calibration changes (see interval below), so the periodic flush is only a
  # safety net and can be rare — fewer flash writes, less CPU blocking.
  flash_write_interval: 30min

stepper:
  - platform: uln2003
    id: my_stepper
    pin_a: GPIO5
    pin_b: GPIO4
    pin_c: GPIO14
    pin_d: GPIO12
    max_speed: 150 steps/s
    acceleration: 300
    deceleration: 300
    sleep_when_done: true

globals:
  - id: boot_ready
    type: bool
    restore_value: no
    initial_value: "false"

  # Last persisted stepper position (survives power loss)
  - id: saved_pos
    type: int
    restore_value: yes
    initial_value: "0"

  # Calibration endpoints
  - id: open_steps
    type: int
    restore_value: yes
    initial_value: "0"

  - id: closed_steps
    type: int
    restore_value: yes
    initial_value: "0"

  - id: open_set
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: closed_set
    type: bool
    restore_value: yes
    initial_value: "false"

  # Last published stepper position (detect changes without spamming HA)
  - id: last_published_pos
    type: int
    restore_value: no
    initial_value: "-999999"

  # Movement state on the previous tick — used to publish IDLE and flush once on stop
  - id: was_moving
    type: bool
    restore_value: no
    initial_value: "false"

  # Set when restored globals changed; flushed to flash on the next interval tick
  # (one tick later so the globals component has already staged the new values)
  - id: flash_sync_pending
    type: bool
    restore_value: no
    initial_value: "false"

# ─── Interval ─────────────────────────────────────────────────────────────────

interval:
  - interval: 300ms
    then:
      - lambda: |-
          if (!id(boot_ready)) return;

          if (id(flash_sync_pending)) {
            id(flash_sync_pending) = false;
            global_preferences->sync();
            ESP_LOGD("persist", "Flushed position/calibration to flash (pos=%d)", id(saved_pos));
          }

          int cur = (int)id(my_stepper).current_position;
          int tgt = (int)id(my_stepper).target_position;
          bool moving = cur != tgt;

          if (cur != id(saved_pos)) {
            id(saved_pos) = cur;
          }

          // Motor just stopped: persist the final position now rather than waiting
          // for flash_write_interval, so a power cut right after a move can't
          // restore a stale position.
          if (id(was_moving) && !moving) {
            id(flash_sync_pending) = true;
          }

          bool changed = cur != id(last_published_pos);
          bool state_flip = moving != id(was_moving);
          id(was_moving) = moving;

          if (!(id(open_set) && id(closed_set))) return;
          if (!(moving || changed || state_flip)) return;

          int open_s = id(open_steps);
          int closed_s = id(closed_steps);

          float p = 0.0f;
          if (open_s != closed_s) {
            p = (float)(cur - closed_s) / (float)(open_s - closed_s);
            p = p < 0.0f ? 0.0f : (p > 1.0f ? 1.0f : p);
          }

          // Opening = moving toward the open endpoint, whichever way the steps count
          CoverOperation op = COVER_OPERATION_IDLE;
          if (moving) {
            bool toward_open = (tgt > cur) == (open_s > closed_s);
            op = toward_open ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
          }

          id(last_published_pos) = cur;
          id(blinds_cover).position = p;
          id(blinds_cover).current_operation = op;
          id(blinds_cover).publish_state();

# ─── Sensors ──────────────────────────────────────────────────────────────────

sensor:
  - platform: template
    name: "Blinds Step Position"
    lambda: 'return (float)id(my_stepper).current_position;'
    update_interval: 2s         # Reduced from 500ms — delta filter prevents unnecessary publishes anyway
    filters:
      - delta: 1.0

  - platform: template
    name: "Blinds Saved Position"
    lambda: 'return (float)id(saved_pos);'
    update_interval: 10s        # Reduced from 5s — this value only matters at rest
    filters:
      - delta: 1.0

text_sensor:
  - platform: template
    name: "Blinds Calibration Status"
    update_interval: 30s        # Reduced from 10s — calibration status rarely changes
    lambda: |-
      if ( id(open_set) &&  id(closed_set)) return {"OK (OPEN+CLOSE set)"};
      if ( id(open_set) && !id(closed_set)) return {"Only OPEN set"};
      if (!id(open_set) &&  id(closed_set)) return {"Only CLOSE set"};
      return {"Not calibrated"};

# ─── Cover ────────────────────────────────────────────────────────────────────

cover:
  # Position and operation are pushed by the interval above; no polled lambda.
  - platform: template
    name: "Blinds"
    id: blinds_cover
    device_class: blind
    has_position: true
    optimistic: false

    open_action:
      - if:
          condition:
            lambda: 'return id(boot_ready) && id(open_set) && id(closed_set);'
          then:
            - stepper.set_target:
                id: my_stepper
                target: !lambda 'return id(open_steps);'

    close_action:
      - if:
          condition:
            lambda: 'return id(boot_ready) && id(open_set) && id(closed_set);'
          then:
            - stepper.set_target:
                id: my_stepper
                target: !lambda 'return id(closed_steps);'

    stop_action:
      - lambda: |-
          int cur = (int)id(my_stepper).current_position;
          id(my_stepper).set_target(cur);
          id(saved_pos) = cur;

    position_action:
      - if:
          condition:
            lambda: 'return id(boot_ready) && id(open_set) && id(closed_set);'
          then:
            - stepper.set_target:
                id: my_stepper
                target: !lambda |-
                  float open_s   = (float)id(open_steps);
                  float closed_s = (float)id(closed_steps);
                  int tgt = (int)(closed_s + pos * (open_s - closed_s));
                  float lo = open_s < closed_s ? open_s : closed_s;
                  float hi = open_s > closed_s ? open_s : closed_s;
                  if (tgt < (int)lo) tgt = (int)lo;
                  if (tgt > (int)hi) tgt = (int)hi;
                  return tgt;

# ─── Calibration Buttons ──────────────────────────────────────────────────────

button:
  # Press when blinds are physically at the fully OPEN position
  - platform: template
    name: "Calibrate: Set Open Position"
    on_press:
      - lambda: |-
          id(open_steps) = (int)id(my_stepper).current_position;
          id(open_set)   = true;
          id(saved_pos)  = id(open_steps);
          id(flash_sync_pending) = true;
          ESP_LOGW("calib", "OPEN position set to %d", id(open_steps));

  # Press when blinds are physically at the fully CLOSED position
  - platform: template
    name: "Calibrate: Set Closed Position"
    on_press:
      - lambda: |-
          id(closed_steps) = (int)id(my_stepper).current_position;
          id(closed_set)   = true;
          id(saved_pos)    = id(closed_steps);
          id(flash_sync_pending) = true;
          ESP_LOGW("calib", "CLOSED position set to %d", id(closed_steps));

  # Wipe calibration — useful when re-mounting the blind
  - platform: template
    name: "Calibrate: Clear All"
    on_press:
      - lambda: |-
          id(open_set)     = false;
          id(closed_set)   = false;
          id(open_steps)   = 0;
          id(closed_steps) = 0;
          id(saved_pos)    = 0;
          id(last_published_pos) = -999999;
          id(my_stepper).report_position(0);
          id(my_stepper).set_target(0);
          id(flash_sync_pending) = true;
          ESP_LOGW("calib", "Calibration cleared — stepper reset to 0");

# ─── Manual absolute-position control ─────────────────────────────────────────

number:
  - platform: template
    name: "Blinds Manual Move Steps"
    id: manual_move_steps
    mode: box
    min_value: -200000
    max_value: 200000
    step: 1
    optimistic: true
    restore_value: false
    initial_value: 0
    set_action:
      - lambda: |-
          int tgt = (int)x;
          if (id(open_set) && id(closed_set)) {
            int a = id(open_steps), b = id(closed_steps);
            int lo = a < b ? a : b;
            int hi = a > b ? a : b;
            if (tgt < lo) tgt = lo;
            if (tgt > hi) tgt = hi;
          }
          id(my_stepper).set_target(tgt);
          id(manual_move_steps).publish_state((float)tgt);
